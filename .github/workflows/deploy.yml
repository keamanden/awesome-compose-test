name: Build and Remote SSH Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:     #  Aligned perfectly with push:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Custom Python App
        uses: docker/build-push-action@v5
        with:
          context: ./flask-redis
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/awesome-flask:latest

  deploy-to-vm:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 2m  #  Keeps the tunnel clean on your 512MB VM
          script: |
            # 1. Securely log into Docker Hub from inside your Azure VM
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # 2. Pull down the fresh image we just built, along with official Redis
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/awesome-flask:latest
            docker pull redis:alpine
            
            # 3. Cleanly tear down any older running containers to prevent port clashes
            docker stop flask-app redis || true
            docker rm flask-app redis || true
            
            # 4. Create the internal app network if it doesn't already exist
            docker network create awesome-net || true
            
            # 5. Boot up the brand-new application stack with memory restrictions
            docker run -d --name redis --network awesome-net -m 64m redis:alpine
            docker run -d -p 80:8000 --name flask-app --network awesome-net -e REDIS_HOST=redis -m 128m ${{ secrets.DOCKERHUB_USERNAME }}/awesome-flask:latest
